name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag. A tag is a moving pointer, and a
      # workflow that trusts one is trusting whoever can move it. The comment
      # records which tag the SHA was at the time it was pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Structure only. An unfilled template is supposed to be unfilled, so the
      # fill checks are skipped here and exercised on the example below.
      - name: Lint the regulated template (structure mode)
        run: python3 lint.py --template modules/regulated/templates/regulated-ai-prd-template.md

      - name: Lint the regulated worked example (full gate)
        run: python3 lint.py modules/regulated/examples/dispute-summary/PRD.md

      - name: OS tree gate
        run: python3 lint.py --os

      # Every other check reads a .json file as text, and text is what a broken
      # JSON file still is, so a corrupt routing/omniroute.config.json or
      # harness/MANIFEST.json used to pass this build. This step parses every
      # tracked .json file and reports the file, line, and column of each
      # syntax error. It is a separate step rather than a twelfth tree check,
      # so the eleven keep their meaning.
      - name: JSON files parse
        run: python3 lint.py --json-syntax

      # There is deliberately no workspace step. products/ is gitignored, so a
      # CI checkout has none, and a user's half-filled draft must never fail
      # this build. That check is opt-in and local:
      # python3 lint.py --workspace products/my-product

      # The graph is generated from declarations already in the tree, so a
      # commit that changes a feeds key or a Stage header without regenerating
      # leaves a map that disagrees with the files it describes. This step is
      # what makes docs/GRAPH.md a reading of the repository rather than a
      # second copy of it.
      - name: Graph freshness
        run: python3 tools/graph.py --check

      # The router table in CLAUDE.md is the human face of the task list and
      # harness/MANIFEST.json is the machine face. They are two descriptions of
      # one contract, so a row added to either without the other is a silent
      # divergence. This step proves they still agree, and it passes on a tree
      # with no harness/ at all, because the harness is deletable by design.
      - name: Manifest agrees with the router table
        run: python3 tools/check_manifest.py --quiet

      # The frontmatter pass is derived and idempotent, so a complete tree
      # reports nothing to write. Anything else means a new file landed without
      # its declaration; run the script and commit the result.
      - name: Frontmatter declarations are complete
        run: |
          python3 tools/frontmatter_init.py --dry-run | grep -q "created: 0, extended: 0"

      - name: Unit tests (root)
        run: python3 -m unittest test_lint.py -v

      - name: Unit tests (regulated module, in place)
        run: python3 -m unittest test_lint.py -v
        working-directory: modules/regulated
